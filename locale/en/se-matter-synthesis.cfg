[mod-name]
se-matter-synthesis=Space Exploration: Matter Synthesis

[mod-description]
se-matter-synthesis=Lets the Material fabricator replace mining in the very late game of Space Exploration. Matter fusion gains recipes for water, petroleum gas, light oil, heavy oil, methane gas and coal. Advanced matter fusion adds the fusion matrix, a permanent catalyst: larger batches, far less coolant, no contaminated scrap or junk data, and a naquium ore recipe. An infinite research raises the output of every matter fusion recipe.

